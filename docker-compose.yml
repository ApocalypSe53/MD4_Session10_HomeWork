services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: pharmacy-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode: một node vừa là broker vừa là controller (không cần Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Tắt tự tạo topic để đảm bảo topic chỉ được tạo đúng cấu hình từ code
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  postgres:
    image: postgres:16
    container_name: pharmacy-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # SMTP server giả lập để test gửi email hóa đơn: SMTP 1025, giao diện xem mail http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: pharmacy-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
