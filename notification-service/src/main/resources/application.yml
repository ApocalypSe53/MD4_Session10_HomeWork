spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # KHÁC group-id của inventory-service (inventory-service-group).
      # Hai group khác nhau -> mỗi group nhận một bản sao đầy đủ của mọi sự kiện (fan-out).
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.pharmacy.notification.event.OrderEvent
        spring.json.trusted.packages: com.pharmacy.notification.event
    listener:
      ack-mode: record
      concurrency: 3

  # Mặc định gửi qua Mailpit (docker-compose). Để gửi Gmail thật: xem README.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  kafka:
    topics:
      medicine-stock-events: medicine-stock-events
  notification:
    email:
      enabled: ${MAIL_ENABLED:true}
      from: ${MAIL_FROM:no-reply@pharmacy.local}

logging:
  level:
    org.apache.kafka: warn
